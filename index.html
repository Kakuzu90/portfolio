<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Clyde Arellano — Choose a portfolio</title>
    <meta name="description" content="Choose the technical or client view of Clyde Arellano's portfolio." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clyde Arellano — Portfolio" />
    <meta property="og:description" content="Choose the technical or client view of Clyde Arellano's portfolio." />
    <meta property="og:url" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clyde Arellano — Portfolio" />
    <meta name="twitter:description" content="Choose the technical or client view of Clyde Arellano's portfolio." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      :root { --boot-bg: #f2efe8; --boot-fg: #151515; --boot-accent: #e43d2f; }
      html.dark-theme { --boot-bg: #0d0e0f; --boot-fg: #f3f0e9; --boot-accent: #ff5545; }
      body { margin: 0; }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        grid-template-rows: 1fr auto;
        padding: clamp(1.5rem, 5vw, 4rem);
        overflow: hidden;
        color: var(--boot-fg);
        background: var(--boot-bg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #boot-loader.is-ready { opacity: 0; visibility: hidden; }
      .boot-loader__mark {
        align-self: center;
        font-size: clamp(4.5rem, 18vw, 14rem);
        font-weight: 750;
        line-height: 0.8;
        letter-spacing: -0.09em;
      }
      .boot-loader__mark span { color: var(--boot-accent); }
      .boot-loader__footer {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 1rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .boot-loader__track { height: 2px; overflow: hidden; background: color-mix(in srgb, var(--boot-fg) 18%, transparent); }
      .boot-loader__bar { width: 45%; height: 100%; background: var(--boot-accent); animation: boot-progress 1.1s ease-in-out infinite; }
      @keyframes boot-progress { from { transform: translateX(-110%); } to { transform: translateX(245%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader { transition: none; }
        .boot-loader__bar { width: 100%; animation: none; }
      }
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem('theme')
        if (savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot-loader" role="status" aria-live="polite" aria-label="Loading portfolio">
        <div class="boot-loader__mark" aria-hidden="true">C<span>/</span>A</div>
        <div class="boot-loader__footer">
          <span>Portfolio</span>
          <div class="boot-loader__track" aria-hidden="true"><div class="boot-loader__bar"></div></div>
          <span>Loading</span>
        </div>
      </div>
    </div>
    <noscript>This portfolio requires JavaScript to display its content.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
